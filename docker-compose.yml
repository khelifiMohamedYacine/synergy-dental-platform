# Local development stack. Usage: copy .env.example to .env, fill in secrets, then
#   docker compose up --build
# Everything is served at http://localhost:8080 (WordPress at /, dashboard at /dashboard/, API at /api/v1).

name: synergy

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - dashboard
      - wordpress

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: apply migrations and seed fictional demo data, then exit (doc 04 §9).
  migrate:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: ./dashboard
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - api

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    environment: &wp-env
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WP_URL: ${WP_URL}
      SYNERGY_API_URL: ${SYNERGY_API_URL}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      WORDPRESS_CONFIG_EXTRA: |
        /* Behind Caddy: trust its X-Forwarded-Proto so is_ssl() is correct. */
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', getenv('WP_URL'));
        define('WP_SITEURL', getenv('WP_URL'));
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'production');
    volumes: &wp-volumes
      - wordpress_core:/var/www/html
      - ./wordpress/wp-content/themes/synergy-theme:/var/www/html/wp-content/themes/synergy-theme
      - ./wordpress/wp-content/plugins/synergy-integration:/var/www/html/wp-content/plugins/synergy-integration
    depends_on:
      mariadb:
        condition: service_healthy

  # One-off: install and configure WordPress + WooCommerce and the demo content (idempotent).
  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      <<: *wp-env
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET}
    volumes:
      - wordpress_core:/var/www/html
      - ./wordpress/wp-content/themes/synergy-theme:/var/www/html/wp-content/themes/synergy-theme
      - ./wordpress/wp-content/plugins/synergy-integration:/var/www/html/wp-content/plugins/synergy-integration
      - ./wordpress/provision:/provision:ro
    command: ["sh", "/provision/provision.sh"]
    depends_on:
      wordpress:
        condition: service_started
      mariadb:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  caddy_data:
  postgres_data:
  mariadb_data:
  wordpress_core:
