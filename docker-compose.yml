# Local development stack. Usage: copy .env.example to .env, fill in secrets, then
#   docker compose up --build
# Everything is served at http://localhost:8080 (WordPress at /, dashboard at /dashboard/, API at /api/v1).

name: synergy

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - dashboard
      - wordpress

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - api

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - wordpress_core:/var/www/html
      - ./wordpress/wp-content/themes/synergy-theme:/var/www/html/wp-content/themes/synergy-theme
      - ./wordpress/wp-content/plugins/synergy-integration:/var/www/html/wp-content/plugins/synergy-integration
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  caddy_data:
  postgres_data:
  mariadb_data:
  wordpress_core:
