# Render Blueprint: the whole platform as ONE free Docker web service (see deploy/render/README.md).
# Render dashboard -> New -> Blueprint -> this repository. You are asked for DATABASE_URL only;
# every other secret is generated by Render and kept across deploys.
services:
  - type: web
    name: synergy-dental
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # PostgreSQL connection string, e.g. from Neon (free, no card)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_API_KEY
        generateValue: true
      - key: WP_SALT
        generateValue: true
      - key: WP_ADMIN_PASSWORD     # WordPress admin (user sd_site_owner)
        generateValue: true
      - key: SEED_ADMIN_PASSWORD   # dashboard admin (admin@example.test)
        generateValue: true
